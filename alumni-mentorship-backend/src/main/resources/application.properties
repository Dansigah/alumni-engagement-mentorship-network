# ===============================
# APPLICATION
# ===============================
spring.application.name=alumni-mentorship-backend

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_mentorship_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# Password reset (demo token return is disabled by default)
app.password-reset.demo-mode=${PASSWORD_RESET_DEMO_MODE:false}
app.password-reset.expiry-minutes=${PASSWORD_RESET_TOKEN_MINUTES:20}
